# 跨域配置
spring.mvc.cors.allowed-origins=http://localhost:3000,http://localhost:3001
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*


# 应用名称配置
spring.application.name=AICosplayForGamePlayer

# 科大讯飞语音识别配置 - 从环境变量读取（环境变量从MySQL的system_config表加载）
xfyun.appid=${XFYUN_APPID}
xfyun.api-key=${XFYUN_API_KEY}
xfyun.api-secret=${XFYUN_API_SECRET}
xfyun.host-url=${XFYUN_HOST_URL}

# OpenAI API 配置 - 从环境变量读取（环境变量从MySQL的system_config表加载）
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:}
spring.ai.openai.chat.model=${SPRING_AI_OPENAI_CHAT_MODEL}
spring.ai.openai.chat.temperature=${SPRING_AI_OPENAI_CHAT_TEMPERATURE}

# DeepSeek API 配置 - 从环境变量读取（环境变量从MySQL的system_config表加载）
spring.ai.deepseek.chat.model=${SPRING_AI_DEEPSEEK_CHAT_MODEL:deepseek-chat}
spring.ai.deepseek.chat.temperature=${SPRING_AI_DEEPSEEK_CHAT_TEMPERATURE:0.7}
spring.ai.deepseek.api-key=${sk-0c96998aaa0e4d08aed87ef38c7cb5b2}
# Vosk离线语音识别配置
# Vosk模型路径 - 修改为正确的绝对路径或确保相对路径正确
vosk.model.path=./vosk-model-small-cn-0.22/
# 采样率
vosk.sample.rate=16000

# 语音识别错误处理增强配置
# 当离线识别失败时自动切换到在线识别
vosk.fallback-to-online=true
# 音频格式自动检测
vosk.auto-detect-format=true
# 日志详细级别 - 增加日志以便调试
vosk.log.level=DEBUG

# 语音识别模式配置
# 可选值: offline-first(优先使用离线), online-first(优先使用在线)
speech.recognition.default-mode=offline-first
# 离线识别超时时间(毫秒)
speech.recognition.offline-timeout=10000
# 离线识别最小音频长度(毫秒)
speech.recognition.min-audio-length=200
# 离线识别最大音频长度(毫秒)
speech.recognition.max-audio-length=60000
