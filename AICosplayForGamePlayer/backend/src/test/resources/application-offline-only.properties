# 离线语音识别专用测试配置
# 此配置文件用于专门测试离线语音识别功能，禁用或跳过在线语音识别

# 语音识别模式配置
speech.recognize.default-mode=offline

# 科大讯飞在线语音识别配置（禁用）
speech.recognize.xfyun.appid=test-appid
speech.recognize.xfyun.api-key=test-api-key
speech.recognize.xfyun.api-secret=test-api-secret
speech.recognize.xfyun.api-url=http://localhost:9999/test # 使用不存在的URL确保不会实际调用

# Vosk离线语音识别配置
speech.recognize.vosk.model-path=${user.home}/models/vosk-model-small-cn-0.22
#speech.recognize.vosk.model-path=D:/Code/AICosplaying/AICosplayForGamePlayer/backend/src/main/resources/models/vosk-model-small-cn-0.22

# 语音识别参数配置
speech.recognize.vosk.sample-rate=16000
speech.recognize.vosk.channels=1
speech.recognize.vosk.sample-size-in-bits=16

# 语音识别超时设置
speech.recognize.timeout=30000

# 音频长度限制（毫秒）
speech.recognize.max-duration=60000

# 日志配置
logging.level.com.aicosplay.service.impl=DEBUG
logging.level.com.aicosplay.controller=DEBUG

# 启用测试模式
speech.recognize.test-mode=true

# 禁用在线服务自动切换
speech.recognize.enable-auto-switch=false